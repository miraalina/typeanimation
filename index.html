<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typo Motion – Schrift-Animator</title>
<style>
:root{
  --bg:#ebecf0;--panel:#fff;--line:#e4e5ea;--line2:#d4d6dd;--text:#17181c;--mut:#6c6f78;--acc:#6c47ff;--acc2:#5934f0;--accs:#efeaff;
  --c-text:#ff6b3d;--c-style:#8b5cf6;--c-in:#1f9d63;--c-out:#e5484d;--c-loop:#3b82f6;--r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-columns:68px 290px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr) 214px;
  grid-template-areas:"top top top" "rail side stage" "tl tl tl";overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:6px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:#f4f4f7}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc2)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:#f0f0f4}
button:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text],select{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
input[type=range]{width:100%;accent-color:var(--acc)}
input{user-select:text}
.hidden{display:none!important}
.mut{color:var(--mut)}
.hint{color:var(--mut);font-size:12px;margin:8px 0 0}
kbd{background:#f0f0f4;border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:11px;font-family:inherit}

/* header */
#top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand b{color:var(--acc)}
#pname{border:1px solid transparent;font-weight:600;width:180px}
#pname:hover{border-color:var(--line2)}
#fmt{max-width:300px}
#safeBtn.on{background:var(--accs);color:var(--acc);font-weight:600}
.spacer{flex:1}

/* rail */
#rail{grid-area:rail;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.rbtn{width:58px;padding:9px 0 7px;border:none;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--mut)}
.rbtn svg{width:22px;height:22px}
.rbtn:hover{background:#f3f3f6;color:var(--text)}
.rbtn.on{background:var(--accs);color:var(--acc)}

/* side panel */
#side{grid-area:side;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:16px}
#side h2{margin:0 0 14px;font-size:17px}
#side h3{margin:20px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.add-big{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:10px;background:#f4f4f7;border:1px solid transparent}
.add-big:hover{background:#ececf2;border-color:var(--line2)}
.add-big.h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.add-big.h2{font-size:16px;font-weight:600}
.add-big.h3{font-size:13px}
.upload{width:100%;padding:10px;border:1.5px dashed var(--line2);background:#fafafc;color:var(--acc);font-weight:600}
.upload:hover{border-color:var(--acc);background:var(--accs)}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;position:relative}
.fcard:hover{border-color:var(--acc)}
.fcard.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accs)}
.fcard .fs{font-size:28px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fn{font-weight:600;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.fcard .fm{font-size:11px;color:var(--mut)}
.fcard .x{position:absolute;right:6px;bottom:8px;padding:1px 6px;border:none;background:none;color:var(--mut)}
.fcard .x:hover{color:var(--c-out)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shp{aspect-ratio:1;border-radius:10px;background:#f4f4f7;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent}
.shp:hover{border-color:var(--acc)}
.shp svg{width:56%;height:56%}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgs .im{aspect-ratio:1;border-radius:8px;background:repeating-conic-gradient(#eee 0 25%,#f8f8f8 0 50%) 0 0/14px 14px;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line)}
.imgs .im img{width:100%;height:100%;object-fit:contain}
.imgs .im .x{position:absolute;top:4px;right:4px;padding:0 6px;font-size:11px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.swatches div{aspect-ratio:1;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.12)}
.swatches div.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.bigcolor{display:flex;align-items:center;gap:10px;margin-top:12px}
.bigcolor label{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);position:relative;overflow:hidden;cursor:pointer;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.bigcolor input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* animation tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{cursor:pointer;text-align:center;font-size:11px;line-height:1.25}
.tile .pv{height:52px;display:flex;align-items:center;justify-content:center;font:800 20px/1 system-ui,sans-serif;background:#f3f3f7;border-radius:10px;
  overflow:hidden;position:relative;color:#222;margin-bottom:5px;border:1.5px solid transparent}
.tile:hover .pv{border-color:var(--acc);background:#fff}
.tile.need .pv{opacity:.45}
.pv i{font-style:normal;display:inline-block}
.pv svg{width:64px;height:32px}
.pv .dr{fill:#222;stroke:#222;stroke-width:.8;font:800 24px system-ui,sans-serif;stroke-dasharray:80}
.pv .tk{white-space:nowrap;position:absolute;left:8px;font-size:17px}
.pv .sa,.pv .sb,.pv .sc{position:absolute}
.pv .sb{font-family:Georgia,serif;font-style:italic;font-weight:400;opacity:0}
.pv .sc{font-family:ui-monospace,monospace;font-weight:400;opacity:0}
@keyframes kFade{0%{opacity:0}50%,100%{opacity:1}}
@keyframes kOut{0%,35%{opacity:1}100%{opacity:0}}
@keyframes kUp{0%{transform:translateY(16px);opacity:0}50%,100%{transform:none;opacity:1}}
@keyframes kOutUp{0%,35%{transform:none;opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes kLeftIn{0%{transform:translateX(36px);opacity:0}50%,100%{transform:none;opacity:1}}
@keyframes kRightIn{0%{transform:translateX(-36px);opacity:0}50%,100%{transform:none;opacity:1}}
@keyframes kOutLeft{0%,35%{transform:none;opacity:1}100%{transform:translateX(-36px);opacity:0}}
@keyframes kZoom{0%{transform:scale(.3);opacity:0}50%,100%{transform:none;opacity:1}}
@keyframes kZoomOut{0%,35%{transform:none;opacity:1}100%{transform:scale(.3);opacity:0}}
@keyframes kPop{0%{transform:scale(0)}30%{transform:scale(1.25)}45%,100%{transform:scale(1)}}
@keyframes kBlur{0%{filter:blur(6px);opacity:0}50%,100%{filter:none;opacity:1}}
@keyframes kBlurOut{0%,35%{filter:none;opacity:1}100%{filter:blur(6px);opacity:0}}
@keyframes kPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes kFloat{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
@keyframes kWob{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes kSpin{to{transform:rotate(360deg)}}
@keyframes kGrow{from{transform:scale(1)}to{transform:scale(1.35)}}
@keyframes kType{0%,6%{opacity:0}7%,78%{opacity:1}79%,100%{opacity:0}}
@keyframes kTypeBack{0%,20%{opacity:1}21%,92%{opacity:0}93%,100%{opacity:1}}
@keyframes kLPop{0%{transform:scale(0)}22%{transform:scale(1.3)}35%,100%{transform:scale(1)}}
@keyframes kLRise{0%{transform:translateY(14px);opacity:0}35%,100%{transform:none;opacity:1}}
@keyframes kLDrop{0%{transform:translateY(-18px);opacity:0}15%{opacity:1}30%{transform:translateY(0)}38%{transform:translateY(-5px)}46%,100%{transform:none}}
@keyframes kCon{0%{letter-spacing:12px;opacity:0}55%,100%{letter-spacing:0;opacity:1}}
@keyframes kWave{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
@keyframes kLPulse{0%,50%,100%{transform:scale(1)}25%{transform:scale(1.4)}}
@keyframes kTick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes kDraw{0%{stroke-dashoffset:80;fill-opacity:0}65%{stroke-dashoffset:0;fill-opacity:0}85%,100%{stroke-dashoffset:0;fill-opacity:1}}
@keyframes kRnd{0%,49%{font-weight:800;transform:none}50%,100%{font-weight:300;transform:skewX(-14deg)}}
@keyframes kAo{0%,40%{opacity:1}55%,100%{opacity:0}}
@keyframes kAi{0%,40%{opacity:0}55%,100%{opacity:1}}
@keyframes kCyc{0%,30%{opacity:1}34%,100%{opacity:0}}
.tile:hover .pv-fadeIn{animation:kFade 1.4s infinite}
.tile:hover .pv-fadeOut{animation:kOut 1.4s infinite}
.tile:hover .pv-slideUp{animation:kUp 1.4s infinite}
.tile:hover .pv-outUp{animation:kOutUp 1.4s infinite}
.tile:hover .pv-slideLeft{animation:kLeftIn 1.4s infinite}
.tile:hover .pv-slideRight{animation:kRightIn 1.4s infinite}
.tile:hover .pv-outLeft{animation:kOutLeft 1.4s infinite}
.tile:hover .pv-zoomIn{animation:kZoom 1.4s infinite}
.tile:hover .pv-zoomOut{animation:kZoomOut 1.4s infinite}
.tile:hover .pv-popIn{animation:kPop 1.4s infinite}
.tile:hover .pv-blurIn{animation:kBlur 1.4s infinite}
.tile:hover .pv-blurOut{animation:kBlurOut 1.4s infinite}
.tile:hover .pv-pulse{animation:kPulse 1s infinite}
.tile:hover .pv-float{animation:kFloat 1.6s infinite ease-in-out}
.tile:hover .pv-wobble{animation:kWob .5s infinite ease-in-out}
.tile:hover .pv-spin{animation:kSpin 1.2s infinite}
.tile:hover .pv-grow{animation:kGrow 2s infinite alternate ease-in-out}
.tile:hover .pv-typewriter i{animation:kType 2s infinite steps(1);animation-delay:calc(var(--i)*.16s)}
.tile:hover .pv-typeBack i{animation:kTypeBack 2s infinite steps(1);animation-delay:calc((3 - var(--i))*.16s)}
.tile:hover .pv-letterPop i{animation:kLPop 1.8s infinite both;animation-delay:calc(var(--i)*.1s)}
.tile:hover .pv-letterRise i{animation:kLRise 1.8s infinite both;animation-delay:calc(var(--i)*.1s)}
.tile:hover .pv-letterDrop i{animation:kLDrop 2s infinite both;animation-delay:calc(var(--i)*.1s)}
.tile:hover .pv-contract{animation:kCon 1.6s infinite}
.tile:hover .pv-wave i{animation:kWave 1s infinite ease-in-out;animation-delay:calc(var(--i)*-.15s)}
.tile:hover .pv-letterPulse i{animation:kLPulse 1.4s infinite;animation-delay:calc(var(--i)*.12s)}
.tile:hover .pv-ticker .tk{animation:kTick 2.4s infinite linear}
.tile:hover .pv-draw .dr{animation:kDraw 2.2s infinite}
.tile:hover .pv-randomAlt i{animation:kRnd .6s infinite steps(1)}
.tile:hover .pv-randomAlt i:nth-child(2){animation-duration:.45s}
.tile:hover .pv-randomAlt i:nth-child(3){animation-duration:.8s;animation-delay:.2s}
.tile:hover .pv-randomAlt i:nth-child(4){animation-duration:.55s;animation-delay:.1s}
.tile:hover .pv-styleTo .sa{animation:kAo 1.6s infinite}
.tile:hover .pv-styleTo .sb{animation:kAi 1.6s infinite}
.tile:hover .pv-styleCycle .sa,.tile:hover .pv-styleCycle .sb,.tile:hover .pv-styleCycle .sc{animation:kCyc 1.8s infinite steps(1);opacity:0}
.tile:hover .pv-styleCycle .sb{animation-delay:.6s}.tile:hover .pv-styleCycle .sc{animation-delay:1.2s}

.mine{display:flex;flex-direction:column;gap:5px}
.mi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.mi:hover{border-color:var(--line2);background:#fafafc}
.mi.on{border-color:var(--acc);background:var(--accs)}
.mi .t{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.g-text{background:var(--c-text)}.g-style{background:var(--c-style)}.g-in{background:var(--c-in)}.g-out{background:var(--c-out)}.g-loop{background:var(--c-loop)}
.card{border:1px solid var(--acc);border-radius:12px;padding:14px;background:#fcfbff;margin-bottom:6px}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card .hd b{flex:1;font-size:14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;color:var(--mut);font-size:11.5px;margin-bottom:5px}
.fld select,.fld input[type=number]{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv{display:flex;justify-content:space-between;color:var(--mut);font-size:11.5px;margin-bottom:3px}
.rv b{color:var(--text);font-weight:500}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#fff}
.seg button{flex:1;border:none;border-radius:0;padding:6px 2px;font-size:12px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--acc);color:#fff}
.note{background:#fff6e5;border:1px solid #ffe2a8;color:#7a5200;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.empty-side{color:var(--mut);text-align:center;padding:30px 10px}
.empty-side .ic{font-size:34px;margin-bottom:8px}

/* stage */
#stageWrap{grid-area:stage;position:relative;overflow:hidden}
#bleed,#ov{position:absolute;left:0;top:0}
#ov{z-index:3}
#stage{position:absolute;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.12)}
#stage canvas{position:absolute;left:0;top:0;display:block}
#ov{touch-action:none}
#zoomBar{position:absolute;right:12px;bottom:10px;z-index:10;display:flex;align-items:center;gap:2px;background:#fff;border-radius:10px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.08)}
#zoomBar button{border:none;padding:5px 9px;font-size:12.5px}
#zoomBar #zpct{min-width:58px;font-variant-numeric:tabular-nums;font-weight:600}
#stageInfo{color:var(--mut);font-size:11.5px;padding:0 8px}
#stageEmpty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;color:#9a9ca5;font-size:14px;line-height:1.5;max-width:260px}
#dropHint{position:absolute;inset:12px;border:2.5px dashed var(--acc);border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:600;color:var(--acc);background:rgba(108,71,255,.07);pointer-events:none;z-index:20}
#textEd{position:absolute;z-index:5;background:transparent;border:none;outline:2px solid var(--acc);outline-offset:4px;resize:none;overflow:hidden;
  padding:0;margin:0;overflow-wrap:break-word;caret-color:var(--acc);transform-origin:50% 50%;font-kerning:normal}

/* context toolbar */
#ctx{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:#fff;border-radius:12px;padding:5px;display:flex;align-items:center;gap:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.08);max-width:calc(100% - 20px);overflow-x:auto}
#ctx button{border-color:transparent;padding:6px 8px;font-size:12.5px;flex:none}
#ctx button:hover{background:#f1f1f5}
#ctx button.on{background:var(--accs);color:var(--acc)}
#ctx .sep{width:1px;height:24px;background:var(--line);margin:0 3px;flex:none}
#ctx .font-sel{width:150px;flex:none;border-color:var(--line)}
#ctx .sz{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px}
#ctx .sz button{padding:5px 8px}
#ctx .sz input{width:52px;border:none;text-align:center;padding:5px 0;box-shadow:none}
#ctx .inl{display:flex;align-items:center;gap:6px;padding:0 6px;border:1px solid var(--line);border-radius:7px;height:32px;flex:none}
#ctx .inl span{font-size:11.5px;color:var(--mut)}
#ctx .inl input[type=range]{width:72px}
#ctx .inl input[type=number]{width:50px;border:none;padding:4px 0;text-align:right;box-shadow:none}
#ctx .anim-btn{font-weight:600;color:var(--acc)}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);position:relative;overflow:hidden;cursor:pointer;flex:none;display:block}
.sw input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer}
#pop{position:fixed;z-index:30;background:#fff;border-radius:12px;padding:14px;width:270px;box-shadow:0 4px 30px rgba(0,0,0,.18);border:1px solid var(--line)}
#pop h4{margin:0 0 10px;font-size:13px}
.st{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-bottom:5px}
.st:hover{border-color:var(--line2)}
.st.on{border-color:var(--acc);background:var(--accs)}
.st .rad{width:13px;height:13px;border-radius:50%;border:2px solid #b5b7c0;flex:none}
.st.on .rad{border-color:var(--acc);background:radial-gradient(var(--acc) 0 3px,transparent 3.5px)}
.st .stn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .tag{font-size:10.5px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
.st input{width:84px;padding:2px 5px;font-size:11px}
.st button{padding:0 5px;border:none;background:none;color:var(--mut)}

/* timeline */
#tl{grid-area:tl;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#transport{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line)}
#play{width:38px;height:34px;border-radius:50%;padding:0;background:var(--text);color:#fff;border:none;font-size:13px}
#play:hover{background:#000}
#time{font-variant-numeric:tabular-nums;font-weight:600;min-width:120px}
#transport label{display:flex;align-items:center;gap:6px;color:var(--mut)}
#transport input[type=number]{width:62px}
#tlScroll{flex:1;overflow:auto;position:relative}
#tlInner{position:relative;min-height:100%}
.row{display:flex;height:38px}
.row .name{width:170px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;background:#fff;border-right:1px solid var(--line);
  position:sticky;left:0;z-index:2;cursor:grab;font-size:12px}
.row .name .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name .ty{width:20px;height:20px;border-radius:5px;background:#f0f0f4;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--mut);flex:none}
.row .name button{padding:1px 3px;font-size:11px;border:none;background:none;opacity:.35}
.row .name button.on{opacity:.9}
.row .name button:hover{background:#f0f0f4;opacity:1}
.row.sel .name{background:var(--accs);color:var(--acc);font-weight:600}
.row.drop-above{box-shadow:inset 0 2px 0 var(--acc)}
.row.drop-below{box-shadow:inset 0 -2px 0 var(--acc)}
.track{position:relative;flex:1;min-width:300px;cursor:crosshair}
.ruler{height:24px;position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line)}
.ruler .name{color:var(--mut);font-size:11px;cursor:default;font-weight:400}
#ruler{cursor:ew-resize}
.tick{position:absolute;bottom:0;width:1px;background:#e4e5ea}
.tick.major{height:9px;background:#c3c5cc}
.tick.minor{height:4px}
.tick span{position:absolute;bottom:9px;left:3px;font-size:10px;color:var(--mut);white-space:nowrap}
.span{position:absolute;top:4px;bottom:4px;border-radius:8px;background:#f1f1f5;border:1px solid #e3e3ea}
.row.sel .span{background:#f3efff;border-color:#d5c9ff}
.span .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.span .h.l{left:-1px;border-radius:8px 0 0 8px}.span .h.r{right:-1px;border-radius:0 8px 8px 0}
.span .h:hover{background:rgba(108,71,255,.25)}
.span .tip{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#a5a7b0;font-size:11px;pointer-events:none;white-space:nowrap}
.blk{position:absolute;top:8px;height:22px;border-radius:6px;font-size:11px;color:#fff;padding:0 9px;display:flex;align-items:center;font-weight:600;
  overflow:hidden;white-space:nowrap;cursor:grab;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.blk.selb{outline:2.5px solid var(--text);outline-offset:1px;z-index:4}

#playhead:before{content:"";position:absolute;top:0;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--acc)}

/* menus */
#animMenu{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;

  opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}

<script>
"use strict";
/* ================= Utils ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const r2=(v,d=2)=>{const m=Math.pow(10,d);return Math.round(v*m)/m};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const hash=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const EASE={linear:t=>t,easeIn:t=>t*t*t,easeOut:t=>1-Math.pow(1-t,3),
  easeInOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}};
const TRANS={cut:'Schnitt (hart)',fade:'Überblenden',cascade:'Kaskade',wipe:'Wischen →',wipeUp:'Wischen ↑',slide:'Schieben ↑',blur:'Unschärfe',pop:'Pop',flicker:'Flackern',glitch:'Glitch'};
const FORMATS=[
  {id:'reel',label:'Instagram Reel / Story · 1080×1920',w:1080,h:1920},
  {id:'land',label:'Querformat 16:9 · 1920×1080',w:1920,h:1080},
  {id:'portrait',label:'Feed Hochformat 4:5 · 1080×1350',w:1080,h:1350},
  {id:'square',label:'Quadrat 1:1 · 1080×1080',w:1080,h:1080},
  {id:'custom',label:'Benutzerdefiniert…'}];
const SYS_FONTS=[
  {label:'Serif (System)',v:'Georgia, "Times New Roman", serif'},
  {label:'Sans (System)',v:'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif'},
  {label:'Mono (System)',v:'ui-monospace, Menlo, Consolas, monospace'}];
const ALT_FEAT=/^(ss\d\d|cv\d\d|salt|swsh|cswh|titl|dlig|hlig|smcp|c2sc|onum|ornm|hist|aalt|nalt|rand|zero|case)$/;
const FEAT_NAMES={salt:'Stilistische Alternativen',swsh:'Swashes',cswh:'Kontext-Swashes',titl:'Titling',dlig:'Bed. Ligaturen',hlig:'Hist. Ligaturen',
  smcp:'Kapitälchen',c2sc:'Versal-Kapitälchen',onum:'Mediävalziffern',ornm:'Ornamente',hist:'Historisch',aalt:'Alle Alternativen',nalt:'Alt. Annotation',
  rand:'Zufall',zero:'Null mit Strich',case:'Versalformen'};
function featLabel(f){if(f.label)return f.label;if(/^ss\d\d/.test(f.tag))return 'Stilset '+(+f.tag.slice(2));if(/^cv\d\d/.test(f.tag))return 'Variante '+(+f.tag.slice(2));return FEAT_NAMES[f.tag]||f.tag}
function bufToB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64ToBuf(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function readAs(file,how){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r[how](file)})}
let toastT;function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}

/* ================= Animations-Katalog ================= */
const GROUPS=[['text','Text-Effekte'],['style','Alternates'],['in','Rein'],['out','Raus'],['loop','Bewegung']];
const ANIMS={
  typewriter:{n:'Schreib­maschine',g:'text',dir:'in',kind:'letter'},
  draw:{n:'Schreiben',g:'text',dir:'in',kind:'letter'},
  letterPop:{n:'Buchstaben ploppen',g:'text',dir:'in',kind:'letter'},
  letterRise:{n:'Buchstaben steigen',g:'text',dir:'in',kind:'letter'},
  letterDrop:{n:'Buchstaben fallen',g:'text',dir:'in',kind:'letter'},
  contract:{n:'Zusammen­ziehen',g:'text',dir:'in',kind:'letter'},
  ticker:{n:'Laufband ←',g:'text',dir:'loop',kind:'letter'},
  wave:{n:'Welle',g:'text',dir:'loop',kind:'letter'},
  letterPulse:{n:'Buchstaben-Puls',g:'text',dir:'loop',kind:'letter'},
  typeBack:{n:'Rückwärts tippen',g:'text',dir:'out',kind:'letter'},
  randomAlt:{n:'Zufalls-Alternates',g:'style',dir:'loop',kind:'style'},
  styleCycle:{n:'Stile durch­wechseln',g:'style',dir:'loop',kind:'style'},
  styleTo:{n:'Stil wechseln',g:'style',dir:'in',kind:'style'},
  fadeIn:{n:'Einblenden',g:'in',dir:'in',kind:'tr'},slideUp:{n:'Von unten',g:'in',dir:'in',kind:'tr'},
  slideLeft:{n:'Von rechts',g:'in',dir:'in',kind:'tr'},slideRight:{n:'Von links',g:'in',dir:'in',kind:'tr'},
  zoomIn:{n:'Zoom rein',g:'in',dir:'in',kind:'tr'},popIn:{n:'Aufploppen',g:'in',dir:'in',kind:'tr'},blurIn:{n:'Aus Unschärfe',g:'in',dir:'in',kind:'tr'},
  fadeOut:{n:'Ausblenden',g:'out',dir:'out',kind:'tr'},outUp:{n:'Nach oben',g:'out',dir:'out',kind:'tr'},outLeft:{n:'Nach links',g:'out',dir:'out',kind:'tr'},
  zoomOut:{n:'Zoom raus',g:'out',dir:'out',kind:'tr'},blurOut:{n:'In Unschärfe',g:'out',dir:'out',kind:'tr'},
  pulse:{n:'Pulsieren',g:'loop',dir:'loop',kind:'tr'},float:{n:'Schweben',g:'loop',dir:'loop',kind:'tr'},wobble:{n:'Wackeln',g:'loop',dir:'loop',kind:'tr'},
  spin:{n:'Drehen',g:'loop',dir:'loop',kind:'tr'},grow:{n:'Langsam zoomen',g:'loop',dir:'loop',kind:'tr'},
};
const textOnlyG=g=>g==='text'||g==='style';
const plainName=t=>ANIMS[t].n.replace(/­/g,'');
const CURVES={smooth:'Sanft',linear:'Linear',bouncy:'Federnd'};
const ORDERS={ltr:'Links → rechts',rnd:'Zufällig',center:'Von der Mitte'};

/* ================= State ================= */
let P,sel=null,selAnim=null,T=0,playing=false,exporting=false,dirty=true,curTab='text',editId=null,previewEnd=null;
const imgEls={},bmpCache=new Map(),lastReady=new Map(),lastFx=new Map(),prefetched=new Set();
const selL=()=>P.layers.find(l=>l.id===sel)||null;
const selA=()=>{const L=selL();return L&&L.anims.find(a=>a.id===selAnim)||null};
const snapT=t=>Math.round(t*P.fps)/P.fps;
const requestRender=()=>{dirty=true};
const minWH=()=>Math.min(P.width,P.height);

function newProject(){return {v:3,name:'typo-animation',width:1080,height:1920,fps:30,duration:6,bg:'#ffffff',fonts:[],assets:[],layers:[]}}
function baseLayer(type,name){return {id:uid(),type,name,visible:true,locked:false,in:0,out:P.duration,
  base:{x:P.width/2,y:P.height/2,scale:1,rotation:0,opacity:1},anims:[]}}
function makeText(text,size,family){
  const lastFont=P.fonts[P.fonts.length-1];const fam=family||(lastFont?lastFont.css:SYS_FONTS[1].v);
  const L=baseLayer('text',text);
  Object.assign(L,{text,family:fam,size:size||Math.round(minWH()*.13),color:'#17181c',fill:'fill',strokeColor:'#17181c',strokeWidth:4,
    ls:0,lh:1.1,align:'center',boxW:Math.round(P.width*.82),styles:[{name:'Standard',features:''}],startStyle:0,named:false});
  const f=P.fonts.find(f=>f.css===fam);if(f)autoStyles(L,f);
  return L;
}
function makeShape(kind){
  const s=Math.round(minWH()*.45);const L=baseLayer('shape',{rect:'Rechteck',rounded:'Rechteck',ellipse:'Kreis',triangle:'Dreieck',star:'Stern',line:'Linie'}[kind]);
  Object.assign(L,{shape:kind==='rounded'?'rect':kind,w:kind==='line'?Math.round(P.width*.6):s,h:kind==='line'?Math.max(6,Math.round(minWH()*.012)):s,
    radius:kind==='rounded'?Math.round(s*.18):0,color:['#6c47ff','#ff6b3d','#1f9d63','#ffc83d','#17181c'][P.layers.length%5]});return L}
function makeImage(asset){const L=baseLayer('image',asset.name);L.assetId=asset.id;
  const s=Math.min(1,(P.width*.8)/asset.w,(P.height*.8)/asset.h);L.base.scale=r2(s,3);return L}

/* ================= OpenType-Features lesen ================= */
const str4=(dv,o)=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
async function inflate(b){const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'));return await new Response(s).arrayBuffer()}
async function parseFont(buf){
  const dv=new DataView(buf);const sig=dv.getUint32(0);const tabs={};let get;
  if(sig===0x774F4632)return {features:null,fullName:''};
  if(sig===0x774F4646){
    const n=dv.getUint16(12);
    for(let i=0;i<n;i++){const o=44+i*20;tabs[str4(dv,o)]={off:dv.getUint32(o+4),comp:dv.getUint32(o+8),orig:dv.getUint32(o+12)}}
    get=async tag=>{const t=tabs[tag];if(!t)return null;let b=buf.slice(t.off,t.off+t.comp);if(t.comp<t.orig)b=await inflate(b);return new DataView(b)};
  }else{
    const n=dv.getUint16(4);
    for(let i=0;i<n;i++){const o=12+i*16;tabs[str4(dv,o)]={off:dv.getUint32(o+8),len:dv.getUint32(o+12)}}
    get=async tag=>{const t=tabs[tag];return t?new DataView(buf,t.off,t.len):null};
  }
  const g=await get('GSUB'),nm=await get('name');const out=new Map();
  if(g){try{const fl=g.getUint16(6),n=g.getUint16(fl);
    for(let i=0;i<n;i++){const r=fl+2+i*6,tag=str4(g,r),fo=fl+g.getUint16(r+4);let label='';
      if(/^(ss|cv)\d\d$/.test(tag)&&nm){try{const po=g.getUint16(fo);if(po)label=nameLookup(nm,g.getUint16(fo+po+2))||''}catch(e){}}
      if(!out.has(tag)||label)out.set(tag,label)}}catch(e){console.warn('GSUB',e)}}
  let fullName='';try{if(nm)fullName=nameLookup(nm,4)||nameLookup(nm,1)||''}catch(e){}
  return {features:[...out].map(([tag,label])=>({tag,label})).sort((a,b)=>a.tag<b.tag?-1:1),fullName};
}
function nameLookup(nm,id){
  const count=nm.getUint16(2),so=nm.getUint16(4);let best=null,score=-1;
  for(let i=0;i<count;i++){const o=6+i*12,pl=nm.getUint16(o),lang=nm.getUint16(o+4),nid=nm.getUint16(o+6);
    if(nid!==id)continue;const s=pl===3?(lang===0x409?3:2):pl===1?1:pl===0?2:0;
    if(s>score){score=s;best={pl,len:nm.getUint16(o+8),off:nm.getUint16(o+10)}}}
  if(!best)return '';let str='';const base=so+best.off;
  if(best.pl===3||best.pl===0){for(let i=0;i<best.len;i+=2)str+=String.fromCharCode(nm.getUint16(base+i))}
  else{for(let i=0;i<best.len;i++)str+=String.fromCharCode(nm.getUint8(base+i))}
  return str.trim();
}

/* ================= Schriften & Bilder ================= */
const MIME={ttf:'font/ttf',otf:'font/otf',woff:'font/woff',woff2:'font/woff2'};
async function registerFont(f,buf){const ff=new FontFace(f.css,buf);await ff.load();document.fonts.add(ff)}
async function importFontFile(file){
  const ext=file.name.split('.').pop().toLowerCase();const buf=await readAs(file,'readAsArrayBuffer');
  const id=uid();const f={id,css:'UF_'+id,name:file.name.replace(/\.[^.]+$/,''),mime:MIME[ext]||'font/ttf',data:bufToB64(buf),features:[]};
  try{await registerFont(f,buf.slice(0))}catch(e){toast('Schrift konnte nicht geladen werden: '+file.name);return null}
  try{const info=await parseFont(buf);if(info.fullName)f.name=info.fullName;f.features=info.features}catch(e){console.warn(e)}
  P.fonts.push(f);
  const L=selL();
  if(L&&L.type==='text')applyFont(L,f);
  else if(!P.layers.some(l=>l.type==='text')){const t=makeText('Text',null,f.css);addLayer(t,false)}
  const n=f.features?f.features.filter(x=>/^(ss\d\d|salt|swsh)$/.test(x.tag)).length:0;
  toast(f.features===null?`„${f.name}“ geladen (WOFF2: Alternates bitte manuell hinzufügen)`:`„${f.name}“ geladen · ${n} Alternates erkannt`);
  refreshUI();commit();return f;
}
function autoStyles(L,f){
  if(!f.features||L.styles.some(s=>s.features))return 0;
  const alts=f.features.filter(x=>/^(ss\d\d|salt|swsh)$/.test(x.tag)).slice(0,12);
  for(const a of alts)L.styles.push({name:featLabel(a),features:a.tag});
  return alts.length;
}
function applyFont(L,f){L.family=f.css;autoStyles(L,f);requestRender()}
async function importImageFile(file){
  const data=await readAs(file,'readAsDataURL');const img=await loadImg(data);
  const a={id:uid(),name:file.name.replace(/\.[^.]+$/,''),data,w:img.naturalWidth||1000,h:img.naturalHeight||1000};
  imgEls[a.id]=img;P.assets.push(a);addLayer(makeImage(a),false);refreshUI();commit();
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function importFiles(files){
  for(const f of files){const ext=f.name.split('.').pop().toLowerCase();

  octx.setLineDash([5,4]);octx.beginPath();

function startEdit(L,selAll){

  if(sel!==L.id)select(L.id);editId=L.id;

  const ta=document.createElement('textarea');ta.id='textEd';ta.value=L.text;ta.spellcheck=false;$('#stageWrap').appendChild(ta);
  styleEditor();ta.focus();if(selAll)ta.select();else ta.setSelectionRange(ta.value.length,ta.value.length);
  ta.addEventListener('input',()=>{L.text=ta.value;
    if(!L.named){L.name=ta.value.split('\n')[0].slice(0,24)||'Text';const nm=$(`.row[data-id="${L.id}"] .nm`);if(nm)nm.textContent=L.name}
    styleEditor();commit()});
  ta.addEventListener('keydown',e=>{if(e.key==='Escape'||(e.key==='Enter'&&(e.metaKey||e.ctrlKey))){e.preventDefault();finishEdit()}e.stopPropagation()});
  ta.addEventListener('blur',()=>finishEdit());

function styleEditor(){
  const ta=$('#textEd');if(!ta)return;const L=P.layers.find(l=>l.id===editId);if(!L){finishEdit();return}
  const tr=getTr(L,T),s=tr.scale*K,st=styleFor(L,styleAt(L,T)),font=P.fonts.find(f=>f.css===L.family);
  Object.assign(ta.style,{fontFamily:font?`"${L.family}"`:L.family,fontSize:L.size*s+'px',lineHeight:String(L.lh),
    letterSpacing:((+L.ls||0)/1000*L.size*s)+'px',fontFeatureSettings:st.features,textAlign:L.align,color:st.color,whiteSpace:L.boxW>0?'pre-wrap':'pre'});
  let w;if(L.boxW>0)w=L.boxW*s;else{ta.style.width='10px';w=Math.max(ta.scrollWidth+4,L.size*s*.6)}
  ta.style.width=w+'px';ta.style.height='10px';const h=Math.max(ta.scrollHeight,L.lh*L.size*s);ta.style.height=h+'px';
  ta.style.left=(OX+tr.x*K-w/2)+'px';ta.style.top=(OY+tr.y*K-h/2)+'px';ta.style.transform=`rotate(${tr.rotation}deg)`;

function createAnim(L,type,t0,t1){
  const a={id:uid(),type,t0:snapT(t0),t1:snapT(t1),curve:'smooth',amt:1,speed:1};
  if(type==='styleTo'){a.style=(styleAt(L,t0)+1)%Math.max(1,L.styles.length);a.trans='cascade'}

  if(type==='randomAlt'){a.interval=.15;a.share=.4}
  if(['letterPop','letterRise','letterDrop'].includes(type))a.order='ltr';
  if(type==='typewriter'||type==='typeBack')a.cursor=true;
  return a;
}
function quickRange(L,type){
  const A=ANIMS[type],lo=L.in,hi=L.out,tt=clamp(T,lo,hi);
  const d=type==='typewriter'||type==='typeBack'?clamp(Array.from(L.text||'').length*.07,.6,4):type==='draw'?2:type==='styleTo'?.6:['letterPop','letterRise','letterDrop'].includes(type)?1.2:.8;
  let t0,t1;
  if(A.dir==='out'){t1=hi;t0=Math.max(lo,hi-d)}
  else if(A.dir==='loop'){t0=tt>=hi-.3?lo:tt;t1=hi}
  else{t0=tt>=hi-.3?lo:tt;t1=Math.min(hi,t0+d)}
  if(t1-t0<1/P.fps)t1=Math.min(P.duration,t0+.5);
  return [t0,t1];
}

  if(t0===undefined)[t0,t1]=quickRange(L,type);

  if(a.t0<L.in)L.in=a.t0;if(a.t1>L.out)L.out=a.t1;
  sel=L.id;selAnim=a.id;curTab='anim';refreshUI();commit();

  if(a.type==='styleCycle'){

    h+=FLD('Übergang',`<select data-b="trans" data-re>${Object.entries(TRANS).map(([k,n])=>`<option value="${k}" ${a.trans===k?'selected':''}>${n}</option>`).join('')}</select>`);
    if(a.trans!=='cut')h+=RANGE('Übergangslänge','data-b="tdur" data-num',a.tdur??.6,.1,1,.05,'pct')}
  if(a.type==='ticker')h+=`<p class="hint" style="margin-top:0">Der Text läuft endlos von rechts nach links über die Fläche.</p>`;
  if(a.type==='draw'){const m=a.mode||'write';h+=`<div class="fld"><span>Art</span>${SEG('drawmode',m,[['write','Schreiben'],['fill','Pinsel'],['line','Kontur']])}</div><p class="hint" style="margin-top:0">${m==='line'?'Die Umrisslinien werden gezeichnet, dann füllt sich die Schrift.':m==='fill'?'Die Fläche wird von den Rändern her aufgemalt.':'Jeder Buchstabe wird entlang seiner Mittellinie geschrieben – Strich für Strich, von links nach rechts.'}</p>`}
  return h+'</div>';
}

/* ================= Eingaben & Klicks ================= */
function readVal(el){let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num!==undefined){v=parseFloat(v);if(isNaN(v))return undefined}return v}
function setPath(o,path,v){const ps=path.split('.');let x=o;for(let i=0;i<ps.length-1;i++)x=x[ps[i]];x[ps[ps.length-1]]=v}
function onInput(el){
  if(el.type==='range'){const rv=el.closest('.fld')&&el.closest('.fld').querySelector('[data-rv]');if(rv&&FMT[el.dataset.fmt])rv.textContent=FMT[el.dataset.fmt](+el.value)}
  const sw=el.closest('.sw');if(sw)sw.style.background=el.value;
  if(el.dataset.bg!==undefined){P.bg=el.value;requestRender();commit();return}
  const L=selL();if(!L)return;
  if(el.dataset.tr){const v=parseFloat(el.value);if(isNaN(v))return;L.base[el.dataset.tr]=v}
  else if(el.dataset.b){const a=selA();if(!a)return;let v=readVal(el);if(v===undefined)return;const k=el.dataset.b;
    if(k==='t0')v=snapT(clamp(v,0,a.t1-1/P.fps));if(k==='t1')v=snapT(clamp(v,a.t0+1/P.fps,P.duration));
    if(k==='type'){const n=createAnim(L,v,a.t0,a.t1);for(const kk of ['style','trans','interval','tdur','share','order','cursor'])if(a[kk]===undefined&&n[kk]!==undefined)a[kk]=n[kk]}
    a[k]=v;renderTimeline()}
  else if(el.dataset.p){let v=readVal(el);if(v===undefined)return;setPath(L,el.dataset.p,v);
    document.querySelectorAll(`#ctx [data-p="${el.dataset.p}"],#pop [data-p="${el.dataset.p}"]`).forEach(o=>{if(o!==el&&o.type!=='color')o.value=v});styleEditor()}
  else return;
  requestRender();commit();
}
for(const id of ['#side','#ctx','#pop']){
  const c=$(id);
  c.addEventListener('input',e=>{if(e.target.tagName!=='SELECT')onInput(e.target)});
  c.addEventListener('change',e=>{const el=e.target;const L=selL();
    if(el.dataset.addstyle!==undefined&&L){const v=el.value;if(!v)return;
      if(v==='__custom')L.styles.push({name:'Eigener Stil',features:'',custom:true});
      else{const f=P.fonts.find(f=>f.css===L.family);const x=f.features.find(x=>x.tag===v);L.styles.push({name:featLabel(x),features:x.tag})}
      renderPop();renderCtx();renderSide();requestRender();commit();return}
    if(el.tagName==='SELECT')onInput(el);
    if(L&&el.dataset.p==='family'){const f=P.fonts.find(f=>f.css===L.family);if(f&&autoStyles(L,f))toast('Alternates der Schrift übernommen')}
    if(el.dataset.re!==undefined)refreshUI(true);
  });
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('[data-tab]');if(tab){curTab=tab.dataset.tab;renderSide();return}
  const ga=t.closest('[data-gact]');if(ga){({uploadFont:()=>$('#fontFile').click(),uploadImg:()=>$('#imgFile').click(),uploadAny:()=>$('#anyFile').click()})[ga.dataset.gact]();return}
  const at=t.closest('[data-addtext]');if(at){addLayer(makeText('Text',Math.round(minWH()*.13)),true);return}
  const as=t.closest('[data-addshape]');if(as){addLayer(makeShape(as.dataset.addshape));return}
  const df=t.closest('[data-delfont]');if(df){e.stopPropagation();const f=P.fonts.find(f=>f.id===df.dataset.delfont);
    if(P.layers.some(l=>l.type==='text'&&l.family===f.css)){toast('Schrift wird noch von einem Text verwendet');return}
    P.fonts.splice(P.fonts.indexOf(f),1);renderSide();return}
  const fc=t.closest('[data-font]');if(fc){const f=P.fonts.find(f=>f.id===fc.dataset.font);const L=selL();
    if(L&&L.type==='text'){applyFont(L,f);refreshUI();commit()}else addLayer(makeText('Text',null,f.css),true);return}
  const da=t.closest('[data-delasset]');if(da){const id=da.dataset.delasset;P.layers=P.layers.filter(l=>l.assetId!==id);P.assets=P.assets.filter(a=>a.id!==id);if(sel&&!selL())sel=null;refreshUI();requestRender();commit();return}
  const ia=t.closest('[data-asset]');if(ia){addLayer(makeImage(P.assets.find(x=>x.id===ia.dataset.asset)));return}
  const bc=t.closest('[data-bgc]');if(bc){P.bg=bc.dataset.bgc;renderSide();requestRender();commit();return}
  const ad=t.closest('[data-addanim]');if(ad){const L=selL();if(L)addAnim(L,ad.dataset.addanim);return}
  const sa=t.closest('[data-selanim]');if(sa){const L=selL();const a=L.anims.find(x=>x.id===sa.dataset.selanim);selAnim=a.id;refreshUI();preview(a);return}
  const pb=t.closest('[data-pop]');if(pb){openPop(pb.dataset.pop,pb);return}
  if(popKind&&!t.closest('#pop'))closePop();
  const b=t.closest('[data-act]');if(!b||!b.closest('#side,#ctx,#pop'))return;
  if(t.tagName==='INPUT')return;
  const L=selL();if(!L)return;const a=selA(),act=b.dataset.act,i=+b.dataset.i;
  switch(act){
    case 'del':delLayer(L.id);return;
    case 'dup':dupLayer(L.id);return;
    case 'fwd':moveLayer(L.id,1);return;
    case 'bwd':moveLayer(L.id,-1);return;
    case 'openAnim':curTab='anim';renderSide();return;
    case 'size':L.size=Math.max(4,Math.round(L.size*(1+.1*+b.dataset.v)));break;
    case 'align':L.align={left:'center',center:'right',right:'left'}[L.align];break;
    case 'fillmode':L.fill=b.dataset.v;break;
    case 'wrap':L.boxW=b.dataset.v==='on'?(L.boxW||Math.round(P.width*.82)):0;break;
    case 'startStyle':if(t.closest('[data-act=delStyle]'))return;L.startStyle=i;break;
    case 'delStyle':e.stopPropagation();delStyle(L,i);break;
    case 'fitImg':{const as=P.assets.find(x=>x.id===L.assetId);if(!as)break;const f=b.dataset.v==='cover'?Math.max:Math.min;
      Object.assign(L.base,{scale:r2(f(P.width/as.w,P.height/as.h),4),x:P.width/2,y:P.height/2,rotation:0});break}
    case 'curve':if(a)a.curve=b.dataset.v;break;
    case 'order':if(a)a.order=b.dataset.v;break;
    case 'cursor':if(a)a.cursor=b.dataset.v==='on';break;
    case 'drawmode':if(a)a.mode=b.dataset.v;break;
    case 'previewAnim':if(a)preview(a);return;
    case 'delAnim':delAnim(L,selAnim);return;
    case 'closeAnim':selAnim=null;refreshUI();return;
    default:return;
  }
  refreshUI(true);requestRender();commit();
});

$('#animMenu').addEventListener('click',e=>{const it=e.target.closest('[data-type]');if(!it||!menuCtx)return;const {L,t0,t1}=menuCtx;closeAnimMenu();addAnim(L,it.dataset.type,t0,t1)});

/* ================= Zeitleiste ================= */
let PPS=100;const X0=12,NAMEW=170;
const tx=t=>X0+t*PPS;
const fmtT=t=>{const m=Math.floor(t/60),s=t-m*60;return `${m}:${s.toFixed(1).padStart(4,'0')}`};
function renderRuler(){
  const r=$('#ruler');PPS=Math.max(10,(r.clientWidth-X0-16)/P.duration);
  const step=PPS>110?.5:PPS>40?1:PPS>18?2:5,minor=step/(step===.5?5:step===1?4:2);let h='';
  for(let t=0;t<=P.duration+1e-6;t+=minor){const maj=Math.abs(t/step-Math.round(t/step))<1e-6;
    h+=`<div class="tick ${maj?'major':'minor'}" style="left:${tx(t)}px">${maj?`<span>${r2(t,1)}s</span>`:''}</div>`}
  r.innerHTML=h;
}
const TY={text:'T',shape:'◆',image:'▣'};
const GCOL={text:'var(--c-text)',style:'var(--c-style)',in:'var(--c-in)',out:'var(--c-out)',loop:'var(--c-loop)'};
function blkLabel(L,a){if(a.type==='styleTo'){const s=L.styles[a.style];return `→ ${s?s.name:'?'}`}return plainName(a.type)}
function renderTimeline(){
  if(!P)return;renderRuler();
  const rows=$('#rows');
  rows.innerHTML=[...P.layers].reverse().map(L=>{
    let inner=`<div class="span" style="left:${tx(L.in)}px;width:${Math.max(4,(L.out-L.in)*PPS)}px"><div class="h l" data-h="l" title="Sichtbar ab"></div><div class="h r" data-h="r" title="Sichtbar bis"></div>
      ${L.anims.length||L.id!==sel?'':'<span class="tip">Bereich ziehen → Animation wählen</span>'}</div>`;
    for(const a of L.anims){const A=ANIMS[a.type];if(!A)continue;
      inner+=`<div class="blk ${a.id===selAnim?'selb':''}" data-blk="${a.id}" style="left:${tx(a.t0)}px;width:${Math.max(6,(a.t1-a.t0)*PPS)}px;background:${GCOL[A.g]}" title="${esc(plainName(a.type))} · ${r2(a.t0)}–${r2(a.t1)} s">
        <div class="h l" data-bh="l"></div>${esc(blkLabel(L,a))}<div class="h r" data-bh="r"></div></div>`}
    return `<div class="row ${L.id===sel?'sel':''}" data-id="${L.id}"><div class="name" draggable="true">
      <span class="ty">${TY[L.type]}</span><span class="nm" title="Doppelklick: umbenennen">${esc(L.name)}</span>
      <button class="${L.visible?'on':''}" data-vis title="Sichtbar">👁</button><button class="${L.locked?'on':''}" data-lock title="Sperren">🔒</button></div>
      <div class="track">${inner}</div></div>`}).join('')||`<div class="row"><div class="name mut">– noch leer –</div><div class="track"></div></div>`;
  positionPlayhead();
}
function positionPlayhead(){$('#playhead').style.left=(NAMEW+tx(T))+'px';$('#time').textContent=`${fmtT(T)} / ${fmtT(P.duration)}`}
function setTime(t){T=clamp(t,0,P.duration);positionPlayhead();styleEditor();requestRender()}
function trackT(e){const r=$('#ruler').getBoundingClientRect();return clamp((e.clientX-r.left-X0)/PPS,0,P.duration)}
function stopPlay(){if(playing){playing=false;previewEnd=null;updPlay()}}
$('#ruler').addEventListener('pointerdown',e=>{e.preventDefault();stopPlay();setTime(snapT(trackT(e)));drag(e,(dx,dy,ev)=>setTime(snapT(trackT(ev))))});
$('#rows').addEventListener('pointerdown',e=>{
  const row=e.target.closest('.row');if(!row||!row.dataset.id)return;const L=P.layers.find(l=>l.id===row.dataset.id);if(!L)return;
  if(e.target.closest('.name')){
    if(e.target.closest('[data-vis]')){L.visible=!L.visible;renderTimeline();requestRender();commit();return}
    if(e.target.closest('[data-lock]')){L.locked=!L.locked;renderTimeline();requestRender();commit();return}
    if(sel!==L.id||selAnim)select(L.id);return}
  e.preventDefault();closeAnimMenu();stopPlay();
  const blkEl=e.target.closest('[data-blk]'),bh=e.target.closest('[data-bh]'),hEl=e.target.closest('[data-h]');
  if(blkEl){const a=L.anims.find(x=>x.id===blkEl.dataset.blk);
    if(sel!==L.id||selAnim!==a.id){sel=L.id;selAnim=a.id;curTab='anim';refreshUI()}
    const t0=a.t0,t1=a.t1;
    if(bh){const side=bh.dataset.bh;
      drag(e,dx=>{const d=dx/PPS;if(side==='l')a.t0=snapT(clamp(t0+d,0,a.t1-1/P.fps));else a.t1=snapT(clamp(t1+d,a.t0+1/P.fps,P.duration));
        setTime(side==='l'?a.t0:a.t1);renderTimeline()},()=>{renderSide();commit()});return}
    drag(e,dx=>{let d=snapT(dx/PPS);d=clamp(d,-t0,P.duration-t1);a.t0=snapT(t0+d);a.t1=snapT(t1+d);setTime(a.t0);renderTimeline()},
      (ev,dx)=>{if(Math.abs(dx)<3)preview(a);renderSide();commit()});return}
  if(hEl){const side=hEl.dataset.h,i0=L.in,o0=L.out;if(sel!==L.id)select(L.id);
    drag(e,dx=>{const d=dx/PPS;if(side==='l')L.in=snapT(clamp(i0+d,0,L.out-1/P.fps));else L.out=snapT(clamp(o0+d,L.in+1/P.fps,P.duration));renderTimeline();requestRender()},()=>commit());return}
  const tStart=snapT(trackT(e));let rng=null;if(sel!==L.id||selAnim)select(L.id);setTime(tStart);
  drag(e,(dx,dy,ev)=>{if(Math.abs(dx)<5&&!rng)return;const t=snapT(trackT(ev));
    if(!rng){rng=document.createElement('div');rng.className='rng';$(`.row[data-id="${L.id}"] .track`).appendChild(rng)}
    const a=Math.min(tStart,t),b=Math.max(tStart,t);rng.style.left=tx(a)+'px';rng.style.width=Math.max(2,(b-a)*PPS)+'px';setTime(t)},
  ev=>{if(!rng)return;const t=snapT(trackT(ev)),a=Math.min(tStart,t),b=Math.max(tStart,t);setTime(a);openAnimMenu(L,a,b,rng.getBoundingClientRect())});
});
$('#rows').addEventListener('dblclick',e=>{
  const nm=e.target.closest('.nm');if(!nm)return;const L=P.layers.find(l=>l.id===nm.closest('.row').dataset.id);
  const inp=document.createElement('input');inp.type='text';inp.value=L.name;inp.style.width='100%';nm.replaceWith(inp);inp.focus();inp.select();
  inp.onblur=()=>{L.name=inp.value||L.name;L.named=true;renderTimeline();commit()};
  inp.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value=L.name;inp.blur()}};
});
let dragId=null;
$('#rows').addEventListener('dragstart',e=>{const row=e.target.closest('.row');dragId=row&&row.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','layer')});
$('#rows').addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const row=e.target.closest('.row');
  document.querySelectorAll('.drop-above,.drop-below').forEach(r=>r.classList.remove('drop-above','drop-below'));
  if(row&&row.dataset.id&&row.dataset.id!==dragId){const r=row.getBoundingClientRect();row.classList.add(e.clientY<r.top+r.height/2?'drop-above':'drop-below')}});
$('#rows').addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();e.stopPropagation();const row=e.target.closest('.row');
  if(row&&row.dataset.id&&row.dataset.id!==dragId){const above=row.classList.contains('drop-above');
    const from=P.layers.findIndex(l=>l.id===dragId);const [L]=P.layers.splice(from,1);const to=P.layers.findIndex(l=>l.id===row.dataset.id);
    P.layers.splice(above?to+1:to,0,L);commit();requestRender()}
  dragId=null;renderTimeline()});
$('#rows').addEventListener('dragend',()=>{dragId=null;renderTimeline()});

/* ================= Wiedergabe ================= */
function updPlay(){$('#play').textContent=playing?'❚❚':'▶';requestRender()}
function togglePlay(){if(exporting)return;if(editId)finishEdit();playing=!playing;previewEnd=null;if(playing&&T>=P.duration-1e-3)T=0;updPlay()}
$('#play').onclick=togglePlay;
let lastNow=performance.now();
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;if(exporting)return;
  if(playing){T+=dt;
    if(previewEnd!=null&&T>=previewEnd){T=previewEnd;playing=false;previewEnd=null;updPlay()}
    else if(T>=P.duration){if($('#loop').checked)T=T%P.duration;else{T=P.duration;playing=false;updPlay()}}
    positionPlayhead();dirty=true}
  if(dirty){dirty=false;renderBleed(T);renderFrame(T);drawOverlay()}
}

/* ================= Kopfzeile ================= */
$('#fmt').innerHTML=FORMATS.map(f=>`<option value="${f.id}">${f.label}</option>`).join('');
function syncHeader(){
  const f=FORMATS.find(f=>f.w===P.width&&f.h===P.height);$('#fmt').value=f?f.id:'custom';
  $('#customWH').classList.toggle('hidden',!!f);$('#cw').value=P.width;$('#ch').value=P.height;
  $('#dur').value=P.duration;$('#fps').value=P.fps;$('#pname').value=P.name||'typo-animation';
}
function setSize(w,h){
  w=clamp(Math.round(w),16,4096);h=clamp(Math.round(h),16,4096);const dx=(w-P.width)/2,dy=(h-P.height)/2;
  for(const L of P.layers){L.base.x+=dx;L.base.y+=dy}P.width=w;P.height=h;syncHeader();autoFit=true;fitStage();refreshUI();commit();
}
$('#fmt').onchange=e=>{const f=FORMATS.find(f=>f.id===e.target.value);if(f.w)setSize(f.w,f.h);else $('#customWH').classList.remove('hidden')};
$('#cw').onchange=()=>setSize(+$('#cw').value,P.height);$('#ch').onchange=()=>setSize(P.width,+$('#ch').value);
$('#pname').oninput=e=>{P.name=e.target.value;scheduleAutosave()};
$('#dur').onchange=e=>{const d=clamp(parseFloat(e.target.value)||P.duration,.5,120),old=P.duration;
  for(const L of P.layers){if(Math.abs(L.out-old)<1e-3)L.out=d;L.out=Math.min(L.out,d);L.in=Math.min(L.in,L.out-1/P.fps);
    L.anims=L.anims.filter(a=>a.t0<d);L.anims.forEach(a=>a.t1=Math.min(a.t1,d))}
  P.duration=d;setTime(Math.min(T,d));syncHeader();refreshUI();commit()};
$('#fps').onchange=e=>{P.fps=+e.target.value;commit()};
$('#undo').onclick=undo;$('#redo').onclick=redo;

/* ================= Speichern / Laden ================= */
let dlNS=null;
async function getDownloads(){if(dlNS)return dlNS;try{if(window.claude&&typeof window.claude.use==='function')dlNS=await window.claude.use('downloads')}catch(e){dlNS=null}return dlNS||null}
async function saveFile(name,blob){
  const d=await getDownloads();
  if(d){try{await d.save({filename:name,data:blob});toast('Gespeichert: '+name);return true}
    catch(e){if(e&&e.code==='declined'){toast('Speichern abgebrochen');return false}if(e&&e.code==='rate_limited'){toast('Bitte kurz warten und erneut versuchen');return false}console.warn(e)}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
const fileBase=()=>(P.name||'typo-animation').replace(/[^\w\-]+/g,'-');
$('#saveBtn').onclick=()=>saveFile(fileBase()+'.typomotion.json',new Blob([JSON.stringify(P)],{type:'application/json'}));
$('#openBtn').onclick=()=>$('#projFile').click();
$('#projFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await loadProjectFile(f)};
async function loadProjectFile(file){
  try{const data=JSON.parse(await readAs(file,'readAsText'));if(!data.layers)throw new Error('Kein Projekt');await loadProject(data);toast('Projekt geladen')}
  catch(e){console.error(e);toast('Projekt konnte nicht geladen werden')}
}
function migrate(){
  for(const L of P.layers){
    if(!L.anims)L.anims=[];if(L.keys&&L.keys.length)L.base={...L.keys[0].v};delete L.keys;
    if(L.switches){for(const s of L.switches)L.anims.push({id:uid(),type:'styleTo',t0:s.t,t1:Math.min(P.duration,s.t+Math.max(s.trans==='cut'?1/P.fps:s.dur,1/P.fps)),style:s.style,trans:s.trans,curve:'smooth',amt:1,speed:1});delete L.switches}
    L.anims=L.anims.filter(a=>ANIMS[a.type]||(a.type==='slideDown'?(a.type='slideUp',true):a.type==='outDown'?(a.type='outUp',true):a.type==='shake'?(a.type='wobble',true):false));
    delete L.demo;
  }
}
async function loadProject(data){
  stopPlay();finishEdit();P=Object.assign(newProject(),data);migrate();
  for(const f of P.fonts){try{await registerFont(f,b64ToBuf(f.data))}catch(e){console.warn('font',f.name,e)}}
  for(const a of P.assets){try{imgEls[a.id]=await loadImg(a.data)}catch(e){}}
  bmpCache.clear();lastReady.clear();lastFx.clear();prefetched.clear();sel=null;selAnim=null;T=0;hist=[snap()];hi=0;updUndo();
  syncHeader();fitStage();refreshUI();
}
$('#pngBtn').onclick=()=>{renderFrame(T);cv.toBlob(b=>saveFile(`${fileBase()}_${T.toFixed(2)}s.png`,b),'image/png')};

/* ================= Automatisch sichern (Browser) ================= */
let asT=null;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('typomotion',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function scheduleAutosave(){clearTimeout(asT);asT=setTimeout(async()=>{try{await idbSet('project',JSON.stringify(P))}catch(e){}},1200)}
async function tryRestore(){
  try{const s=await idbGet('project');if(!s)return false;const data=JSON.parse(s);if(!data.layers||!data.layers.length)return false;
    await loadProject(data);toast('Letzter Stand wiederhergestellt');return true}catch(e){return false}
}
window.addEventListener('beforeunload',()=>{try{clearTimeout(asT);idbSet('project',JSON.stringify(P))}catch(e){}});

/* ================= Video-Export ================= */
const MIMES=[['video/mp4;codecs=avc1.640028','MP4 (H.264) – für Instagram','mp4'],['video/mp4;codecs=avc1.4d0028','MP4 (H.264) – für Instagram','mp4'],['video/mp4','MP4','mp4'],
  ['video/webm;codecs=vp9','WebM (VP9)','webm'],['video/webm;codecs=vp8','WebM (VP8)','webm'],['video/webm','WebM','webm']];
let exBlob=null,exExt='mp4',exCancel=false;
function showEx(which){['exOpts','exProg','exDone'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==which))}
$('#exportBtn').onclick=()=>{
  if(typeof MediaRecorder==='undefined'||!cv.captureStream){toast('Dein Browser unterstützt keinen Video-Export. Bitte Chrome oder Edge nutzen.',4000);return}
  const seen=new Set(),opts=MIMES.filter(m=>MediaRecorder.isTypeSupported(m[0])).filter(m=>{if(seen.has(m[2]))return false;seen.add(m[2]);return true});
  if(!opts.length){toast('Kein Video-Format verfügbar');return}
  finishEdit();stopPlay();closePop();
  $('#exFmt').innerHTML=opts.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');
  $('#exInfo').textContent=`${P.width} × ${P.height} px · ${P.fps} fps · ${P.duration} s`;
  $('#exNote').innerHTML='Der Export läuft in Echtzeit – bitte diesen Tab sichtbar lassen.'+(opts[0][2]!=='mp4'?'<br>Dieser Browser kann kein MP4 aufnehmen; Instagram akzeptiert kein WebM. Für MP4 Chrome oder Edge verwenden.':'');
  showEx('exOpts');$('#modal').classList.remove('hidden');
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').classList.add('hidden'));
$('#exCancel').onclick=()=>{exCancel=true};
$('#exStart').onclick=async()=>{
  const mime=$('#exFmt').value,bps=+$('#exQ').value;exExt=mime.includes('mp4')?'mp4':'webm';exCancel=false;
  showEx('exProg');$('#exStatus').textContent='Animationen werden vorbereitet…';$('#exBar').style.width='0';
  await prerenderAll();exporting=true;drawOverlay();
  const stream=cv.captureStream(P.fps);let rec;
  try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bps})}catch(e){exporting=false;toast('Recorder-Fehler: '+e.message);$('#modal').classList.add('hidden');return}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>rec.onstop=r);
  renderFrame(0);rec.start(250);const t0=performance.now();
  await new Promise(res=>{const step=()=>{if(exCancel){res();return}const t=(performance.now()-t0)/1000;renderFrame(Math.min(t,P.duration));
    $('#exBar').style.width=Math.min(100,t/P.duration*100)+'%';$('#exStatus').textContent=`Aufnahme… ${Math.min(t,P.duration).toFixed(1)} / ${P.duration} s`;
    if(t>=P.duration+1/P.fps){res();return}requestAnimationFrame(step)};requestAnimationFrame(step)});
  rec.stop();await stopped;stream.getTracks().forEach(t=>t.stop());exporting=false;requestRender();
  if(exCancel){$('#modal').classList.add('hidden');toast('Export abgebrochen');return}
  exBlob=new Blob(chunks,{type:mime.split(';')[0]});
  $('#exDoneTxt').innerHTML=`<b>Fertig!</b> ${(exBlob.size/1048576).toFixed(1)} MB · ${exExt.toUpperCase()} · ${P.width}×${P.height}`;showEx('exDone');
};
$('#exSave').onclick=()=>{if(exBlob)saveFile(`${fileBase()}_${P.width}x${P.height}.${exExt}`,exBlob)};

/* ================= Dateien ================= */
$('#fontFile').onchange=async e=>{await importFiles([...e.target.files]);e.target.value=''};
$('#imgFile').onchange=async e=>{await importFiles([...e.target.files]);e.target.value=''};
$('#anyFile').onchange=async e=>{await importFiles([...e.target.files]);e.target.value=''};
let dragDepth=0;const isFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(!isFiles(e))return;dragDepth++;$('#dropHint').classList.remove('hidden')});
window.addEventListener('dragleave',e=>{if(!isFiles(e))return;if(--dragDepth<=0){dragDepth=0;$('#dropHint').classList.add('hidden')}});
window.addEventListener('dragover',e=>{if(isFiles(e))e.preventDefault()});
window.addEventListener('drop',async e=>{if(!isFiles(e))return;e.preventDefault();dragDepth=0;$('#dropHint').classList.add('hidden');await importFiles([...e.dataTransfer.files])});

/* ================= Tastatur ================= */
window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag),mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(mod&&(e.key==='+'||e.key==='='||e.key==='-'||e.key==='0')){e.preventDefault();if(e.key==='0')zoomFit();else zoomCenter(e.key==='-'?1/1.25:1.25);return}
  if(typing||exporting||!$('#modal').classList.contains('hidden'))return;
  if(e.key==='Escape'){if(menuCtx)closeAnimMenu();else if(popKind)closePop();else if(selAnim){selAnim=null;refreshUI()}else select(null);return}
  const L=selL();
  if(e.code==='Space'){e.preventDefault();if(!spaceDown){spaceDown=true;spacePanned=false;ov.style.cursor='grab'}}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();if(L)dupLayer(L.id)}
  else if((e.key==='Delete'||e.key==='Backspace')&&L){e.preventDefault();if(selAnim)delAnim(L,selAnim);else delLayer(L.id)}
  else if(e.key==='Enter'&&L&&L.type==='text'){e.preventDefault();startEdit(L,false)}
  else if(e.key==='Home')setTime(0);
  else if(e.key==='End')setTime(P.duration);
  else if(e.key.startsWith('Arrow')){e.preventDefault();
    if(L&&!L.locked){const s=e.shiftKey?10:1;const d={ArrowUp:[0,-s],ArrowDown:[0,s],ArrowLeft:[-s,0],ArrowRight:[s,0]}[e.key];L.base.x+=d[0];L.base.y+=d[1];requestRender();commit()}
    else if(e.key==='ArrowLeft')setTime(snapT(T-1/P.fps));else if(e.key==='ArrowRight')setTime(snapT(T+1/P.fps))}
});

window.addEventListener('keyup',e=>{if(e.code==='Space'&&spaceDown){spaceDown=false;ov.style.cursor='default';
  const tag=(e.target.tagName||'').toLowerCase();if(!spacePanned&&!['input','textarea','select'].includes(tag))togglePlay()}});
window.addEventListener('blur',()=>{spaceDown=false});

/* ================= Start ================= */
window.addEventListener('resize',()=>{fitStage();renderTimeline();if(popKind)renderPop()});
new ResizeObserver(()=>fitStage()).observe($('#stageWrap'));
P=newProject();
hist=[snap()];hi=0;updUndo();
syncHeader();fitStage();refreshUI();
requestAnimationFrame(loop);
tryRestore();
</script>
</body>
